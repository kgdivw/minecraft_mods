name: Build and Release

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Blauwe Piglins addon
        run: |
          mkdir -p build/blauwe_piglins
          cp -r blauwe_piglins/BP build/blauwe_piglins/
          cp -r blauwe_piglins/RP build/blauwe_piglins/
          cd build/blauwe_piglins
          zip -r ../BlauwePiglins.mcaddon BP/ RP/

      - name: Create Ninja Mod addon
        run: |
          mkdir -p build/ninja_mod
          cp -r ninja_mod/BP build/ninja_mod/
          cp -r ninja_mod/RP build/ninja_mod/
          cd build/ninja_mod
          zip -r ../NinjaMod.mcaddon BP/ RP/

      - name: Create Dierentuin addon
        run: |
          mkdir -p build/dierentuin
          cp -r dierentuin/BP build/dierentuin/
          cp -r dierentuin/RP build/dierentuin/
          cd build/dierentuin
          zip -r ../Dierentuin.mcaddon BP/ RP/

      - name: Create Superteams addon
        run: |
          mkdir -p build/superteams
          cp -r superteams/BP build/superteams/
          cp -r superteams/RP build/superteams/
          cd build/superteams
          zip -r ../Superteams.mcaddon BP/ RP/

      - name: Create Lava Mod addon
        run: |
          mkdir -p build/lava_mod
          cp -r lava_mod/BP build/lava_mod/
          cd build/lava_mod
          zip -r ../LavaMod.mcaddon BP/

      - name: Create Baas van het Dorp addon
        run: |
          mkdir -p build/dorpsbaas_mod
          cp -r dorpsbaas_mod/BP build/dorpsbaas_mod/
          cp -r dorpsbaas_mod/RP build/dorpsbaas_mod/
          cd build/dorpsbaas_mod
          zip -r ../BaasVanHetDorp.mcaddon BP/ RP/

      - name: Create Tijger Mod addon
        run: |
          mkdir -p build/tijger_mod
          cp -r tijger_mod/BP build/tijger_mod/
          cp -r tijger_mod/RP build/tijger_mod/
          cd build/tijger_mod
          zip -r ../TijgerMod.mcaddon BP/ RP/

      - name: Create Ultrazombie addon
        run: |
          mkdir -p build/ultrazombie
          cp -r ultrazombie/BP build/ultrazombie/
          cp -r ultrazombie/RP build/ultrazombie/
          cd build/ultrazombie
          zip -r ../Ultrazombie.mcaddon BP/ RP/

      - name: Create Robot Mod addon
        run: |
          mkdir -p build/robot_mod
          cp -r robot_mod/BP build/robot_mod/
          cp -r robot_mod/RP build/robot_mod/
          cd build/robot_mod
          zip -r ../RobotMod.mcaddon BP/ RP/

      - name: Create Golem Mod addon
        run: |
          mkdir -p build/golem_mod
          cp -r golem_mod/BP build/golem_mod/
          cp -r golem_mod/RP build/golem_mod/
          cd build/golem_mod
          zip -r ../GolemMod.mcaddon BP/ RP/

      - name: Create Samen Pijn addon
        run: |
          mkdir -p build/samen_pijn_mod
          cp -r samen_pijn_mod/BP build/samen_pijn_mod/
          cp -r samen_pijn_mod/RP build/samen_pijn_mod/
          cd build/samen_pijn_mod
          zip -r ../SamenPijn.mcaddon BP/ RP/

      - name: Create Samen Pijn mcpacks
        run: |
          mkdir -p build
          cd samen_pijn_mod/BP
          zip -r ../../build/SamenPijnGedrag.mcpack .
          cd ../RP
          zip -r ../../build/SamenPijnTexturen.mcpack .

      - name: Create Random Blok Battle addon
        run: |
          mkdir -p build/random_blok_mod
          cp -r random_blok_mod/BP build/random_blok_mod/
          cd build/random_blok_mod
          zip -r ../RandomBlokBattle.mcaddon BP/

      - name: Create Random Blok Battle mcpack
        run: |
          cd random_blok_mod/BP
          zip -r ../../build/RandomBlokBattle.mcpack .

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: |
            🎮 **Minecraft Mods - Latest Build**

            Automatisch gegenereerd van commit: ${{ steps.sha.outputs.short_sha }}

            ## Installatie
            1. Download het `.mcaddon` bestand van je keuze
            2. Open met Minecraft Bedrock Edition
            3. De addon wordt automatisch geïmporteerd
            4. Activeer het Behavior Pack in je wereld instellingen

            ## Mods

            ### Blauwe Piglins
            - Blauwe piglins die vrienden worden met diamonds (5 stuks)
            - Volgen de speler en vallen vijandige piglins aan

            ### Ninja Mod
            - Goede ninja's (handelaars die ninja spullen verkopen)
            - Slechte ninja's (vijandige mobs die 's nachts spawnen)
            - Ninja Koningen (boss mobs met 80 HP)
            - Ninja tempels, kastelen en winkels
            - Goede en slechte ninja's vechten tegen elkaar

            ### Dierentuin
            - Vang wilde dieren (leeuw, panda, papegaai, olifant) met kooien
            - Rijd met een bestuurbaar karretje door je dierentuin
            - Bouw je dierentuin met `/function build_zoo`

            ### Superteams
            - 4 teams met superkrachten: Vuur, IJs, Bliksem, Aarde
            - Hub platform met 4 portals + 4 team eilanden
            - Spawn 10 villagers van jouw team die andere teams aanvallen
            - Bouw huizen, gigantisch herenhuis en armory
            - Zee Paard dat over zee kan zwemmen om vijandige eilanden aan te vallen

            ### Lava Mod
            - Lavablokken verspreid in het landschap
            - Alle mobs, dieren en items die in/op lava komen zakken weg in de lava
            - Spelers blijven gewoon staan (immuun)
            - Vereist Minecraft 1.21+ met experimentele scripting aan

            ### Baas van het Dorp
            - Spawn in een MEGA dorp met wegen, huizen en dorpelingen
            - Word de BAAS: koop een pak (met rode strik), auto en huis via sta-op platforms
            - Bestuurbare auto's van diamant, goud of emerald
            - Versla Herobrine, die mobs en stoute villagers gebruikt om baas te worden
            - Verdien EUR met opdrachten én door Herobrine's mobs te verslaan
            - 100 EUR = emerald huizen, 1000 EUR = regenboog huizen met zwembad + beroemd!

            ### Tijger Mod
            - Craft de Oranje Boog (boog + oranje kleurstof) en Oranje Pijlen (pijl + oranje kleurstof)
            - Schiet een dier of mob met een oranje pijl en het verandert in een Tijger
            - Klik op de tijger om erop te rijden — hij loopt waar jij kijkt
            - `/function geef` voor een gratis boog + 64 pijlen

            ### Ultrazombie
            - Tem een zombie door hem te slaan met rot vlees in je hand
            - Praat met hem in de chat: zeg een mobnaam (blaze, warden, paard...) en hij verandert erin!
            - Zeg "ga hout hakken", "ga mijnen", "vecht", "dans", "kom hier" of "stop"
            - Zegt hij iets grappigs terug als hij je niet snapt
            - LET OP: zet "Beta APIs" aan bij Experimenten in je wereldinstellingen!

            ### Robot Mod
            - Craft het Robot Bouwpakket (8x ijzer + 1x redstone) en zet je eigen robot in elkaar
            - Klik met de afstandsbediening: VOLGEN, VECHTEN of DIAMANT MIJNEN
            - Hij vecht monsters weg en legt elke gevonden diamant bij jou neer
            - Aangevallen? Dan gaat hij KAPOT en staat hij stil (doodgaan kan hij niet)
            - Repareren: redstone in je hand + ijzer in je rugzak, en klik op de robot

            ### Golem Mod
            - De Ultra Golem: 1000 leven, 250 schade, immuun voor vuur, lava en jouw klappen
            - Hij valt ALLES aan behalve spelers — monsters, dieren, dorpelingen
            - Craft een Golem Hart (ijzerblokken + diamanten + redstoneblok) en klik op de grond
            - `/function golem` geeft je meteen 5 harten voor een heel golemleger
            ### Samen Pijn
            - Doet één speler zich pijn, dan doen ALLE spelers zich even veel pijn
            - Werkt bij vallen, vuur, lava, honger, mobs, verdrinken en pvp
            - Je items, rugzak en XP blijven gewoon van jezelf
            - Geen nieuwe texturen; het resourcepakket komt mee en activeert automatisch
            - Kisten en shulkerboxen blijven ook onaangeroerd; geen experimenten nodig
            - Uitzetten met `/function samen_uit`, weer aan met `/function samen_aan`
            - Lukt de `.mcaddon` niet op tablet? Installeer dan eerst `SamenPijnTexturen.mcpack` en daarna `SamenPijnGedrag.mcpack`

            ### Random Blok Battle
            - Elk blok dat je breekt geeft een ander item: glas geeft diamanten, zand geeft goud
            - 114 blokken met hun eigen item, twee blokken geven nooit hetzelfde
            - Er loopt een timer van 100 Minecraft-dagen om spullen te verzamelen
            - Daarna: BATTLE in een arena hoog in de lucht, de laatste die leeft wint
            - In je eentje? Dan vecht je tegen 5 golven monsters
            - `/function battle_lijst` toont de hele lijst, `/function battle_nu` start meteen
          files: |
            build/BlauwePiglins.mcaddon
            build/NinjaMod.mcaddon
            build/Dierentuin.mcaddon
            build/Superteams.mcaddon
            build/LavaMod.mcaddon
            build/BaasVanHetDorp.mcaddon
            build/TijgerMod.mcaddon
            build/Ultrazombie.mcaddon
            build/RobotMod.mcaddon
            build/GolemMod.mcaddon
            build/SamenPijn.mcaddon
            build/SamenPijnGedrag.mcpack
            build/SamenPijnTexturen.mcpack
            build/RandomBlokBattle.mcaddon
            build/RandomBlokBattle.mcpack
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
