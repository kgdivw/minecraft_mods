name: Build and Release

on:
  push:
    branches:
      - master
      - main
      - claude/ridder-mod

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Blauwe Piglins addon
        run: |
          mkdir -p build/blauwe_piglins
          cp -r blauwe_piglins/BP build/blauwe_piglins/
          cp -r blauwe_piglins/RP build/blauwe_piglins/
          cd build/blauwe_piglins
          zip -r ../BlauwePiglins.mcaddon BP/ RP/

      - name: Create Ninja Mod addon
        run: |
          mkdir -p build/ninja_mod
          cp -r ninja_mod/BP build/ninja_mod/
          cp -r ninja_mod/RP build/ninja_mod/
          cd build/ninja_mod
          zip -r ../NinjaMod.mcaddon BP/ RP/

      - name: Create Dierentuin addon
        run: |
          mkdir -p build/dierentuin
          cp -r dierentuin/BP build/dierentuin/
          cp -r dierentuin/RP build/dierentuin/
          cd build/dierentuin
          zip -r ../Dierentuin.mcaddon BP/ RP/

      - name: Create Superteams addon
        run: |
          mkdir -p build/superteams
          cp -r superteams/BP build/superteams/
          cp -r superteams/RP build/superteams/
          cd build/superteams
          zip -r ../Superteams.mcaddon BP/ RP/

      - name: Create Lava Mod addon
        run: |
          mkdir -p build/lava_mod
          cp -r lava_mod/BP build/lava_mod/
          cd build/lava_mod
          zip -r ../LavaMod.mcaddon BP/

      - name: Create Ridder Mod addon
        run: |
          mkdir -p build/ridder_mod
          cp -r ridder_mod/BP build/ridder_mod/
          cp -r ridder_mod/RP build/ridder_mod/
          cd build/ridder_mod
          zip -r ../RidderMod.mcaddon BP/ RP/

      - name: Get short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: |
            🎮 **Minecraft Mods - Latest Build**

            Automatisch gegenereerd van commit: ${{ steps.sha.outputs.short_sha }}

            ## Installatie
            1. Download het `.mcaddon` bestand van je keuze
            2. Open met Minecraft Bedrock Edition
            3. De addon wordt automatisch geïmporteerd
            4. Activeer het Behavior Pack in je wereld instellingen

            ## Mods

            ### Blauwe Piglins
            - Blauwe piglins die vrienden worden met diamonds (5 stuks)
            - Volgen de speler en vallen vijandige piglins aan

            ### Ninja Mod
            - Goede ninja's (handelaars die ninja spullen verkopen)
            - Slechte ninja's (vijandige mobs die 's nachts spawnen)
            - Ninja Koningen (boss mobs met 80 HP)
            - Ninja tempels, kastelen en winkels
            - Goede en slechte ninja's vechten tegen elkaar

            ### Dierentuin
            - Vang wilde dieren (leeuw, panda, papegaai, olifant) met kooien
            - Rijd met een bestuurbaar karretje door je dierentuin
            - Bouw je dierentuin met `/function build_zoo`

            ### Superteams
            - 4 teams met superkrachten: Vuur, IJs, Bliksem, Aarde
            - Hub platform met 4 portals + 4 team eilanden
            - Spawn 10 villagers van jouw team die andere teams aanvallen
            - Bouw huizen, gigantisch herenhuis en armory
            - Zee Paard dat over zee kan zwemmen om vijandige eilanden aan te vallen

            ### Lava Mod
            - Lavablokken verspreid in het landschap
            - Alle mobs, dieren en items die in/op lava komen zakken weg in de lava
            - Spelers blijven gewoon staan (immuun)
            - Vereist Minecraft 1.21+ met experimentele scripting aan

            ### Ridder Mod
            - Kies Ridder, Prins/Prinses of Koning/Koningin via 3 portals
            - Spawn in een gigantisch stenen kasteel (3 verdiepingen, torens, kelder)
            - Gouden troon (koning) of diamanten troon (prins) met lang rood tapijt
            - Ridder krijgt het sterkste harnas + zwaard, schild, boog, kruisboog, speer & pijlen
            - Kasteelbewoners: kok, uitvinder, hofnar en butler
            - Een leger ridders op de binnenplaats + `/function vijand_leger` voor een veldslag
          files: |
            build/BlauwePiglins.mcaddon
            build/NinjaMod.mcaddon
            build/Dierentuin.mcaddon
            build/Superteams.mcaddon
            build/LavaMod.mcaddon
            build/RidderMod.mcaddon
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
